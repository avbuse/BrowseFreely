# BrowseFreely — pull the image built by GitHub Actions (GHCR)
#
# Image: ghcr.io/avbuse/browsefreely:latest
# (also tagged as :sha-<commit> on every main push, and :vX.Y.Z on version tags)
#
# First-time / private package pull:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u YOUR_GITHUB_USERNAME --password-stdin
# If the package is public, no login is required.

services:
  browsefreely:
    image: ghcr.io/avbuse/browsefreely:latest
    container_name: browsefreely
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RATE_LIMIT=100
      - SESSION_SECRET=change-me-to-a-long-random-string
      # - TRUST_PROXY=false
      # - ALLOW_PRIVATE_TARGETS=false
      # - INSECURE_TLS=false
      # - SECURE_COOKIES=false
    restart: unless-stopped
