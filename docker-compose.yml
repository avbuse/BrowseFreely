version: '3.8'

services:
  browsefreely:
    build: .
    image: vinitkumargoel/browsefreely:latest
    container_name: browsefreely
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RATE_LIMIT=100
      - SESSION_SECRET=change-me-to-a-long-random-string
      # - TRUST_PROXY=false
      # - ALLOW_PRIVATE_TARGETS=false
      # - INSECURE_TLS=false
      # - SECURE_COOKIES=false
    restart: unless-stopped
